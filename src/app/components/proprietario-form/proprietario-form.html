<div class="form-wrapper">
  <p-card header="Cadastro de Proprietário">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
      
      <!-- Campo Nome -->
      <div class="field-container">
        <label for="nome">Nome Completo</label>
        <input pInputText id="nome" formControlName="nome" placeholder="Ex: Maria Pereira" class="w-full" />
        <small class="p-error" *ngIf="form.get('nome')?.touched && form.get('nome')?.errors?.['required']">
          O nome é obrigatório.
        </small>
        <small class="p-error" *ngIf="form.get('nome')?.touched && form.get('nome')?.errors?.['minlength']">
          O nome deve conter pelo menos 3 caracteres.
        </small>
      </div>

      <!-- Campo CPF -->
      <div class="field-container">
        <label for="cpf">CPF (somente números)</label>
        <input pInputText id="cpf" formControlName="cpf" maxlength="11" placeholder="00000000000" class="w-full" />
        <small class="p-error" *ngIf="form.get('cpf')?.touched && form.get('cpf')?.errors?.['required']">
          O CPF é obrigatório.
        </small>
        <small class="p-error" *ngIf="form.get('cpf')?.touched && form.get('cpf')?.errors?.['pattern']">
          Digite 11 números válidos.
        </small>
      </div>

      <!-- Subseção Propriedades -->
      <div class="properties-header">
        <h3>Propriedades</h3>
        <p-button 
          label="Adicionar Propriedade" 
          icon="pi pi-plus" 
          severity="secondary" 
          [outlined]="true" 
          size="small" 
          (onClick)="adicionarPropriedade()">
        </p-button>
      </div>

      <div formArrayName="propriedades" class="properties-list">
        <div *ngFor="let prop of propriedades.controls; let i = index" [formGroupName]="i" class="property-row">
          <input 
            pInputText 
            formControlName="nome" 
            placeholder="Nome/Identificação da Propriedade" 
            class="prop-input-nome" 
          />

          <input 
            pInputText 
            type="number"
            step="any"
            formControlName="area" 
            placeholder="Área (ha/m²)" 
            class="prop-input-area" 
          />

          <p-button 
            icon="pi pi-trash" 
            severity="danger" 
            [text]="true"
            (onClick)="removerPropriedade(i)" 
            [disabled]="propriedades.length === 1">
          </p-button>
        </div>
      </div>

      <!-- Ação Principal -->
      <div class="footer-actions">
        <p-button 
          type="submit" 
          [label]="salvando ? 'Salvando...' : 'Salvar Proprietário'" 
          icon="pi pi-check" 
          [loading]="salvando" 
          styleClass="w-full">
        </p-button>
      </div>
    </form>
  </p-card>
</div>
